services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-auth-api
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - user-auth-network

  db:
    image: mysql:8.4
    container_name: user-auth-mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - user-auth-network

volumes:
  mysql_data:

networks:
  user-auth-network:
    driver: bridge