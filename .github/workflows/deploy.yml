
name: Deploy User Auth API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-auth-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, node-deploy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: sudo -n /usr/local/sbin/deploy-user-auth
